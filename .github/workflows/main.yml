name: Build Siraj APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check zip
        run: |
          ls -la
          if [ ! -f siraj_android.zip ]; then
            echo "::error::الملف siraj_android.zip مش موجود في الريبو. ارفعه الأول."
            exit 1
          fi

      - name: Unpack project
        run: |
          rm -rf proj && mkdir proj
          unzip -q siraj_android.zip -d proj
          ls proj
          test -f proj/settings.gradle.kts || (echo "::error::settings.gradle.kts مش موجود، الزيب متفتح غلط" && exit 1)

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p proj :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siraj-debug-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
