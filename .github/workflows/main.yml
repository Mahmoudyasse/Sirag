name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*siraj*.zip" -not -path "./.git/*" | head -n1)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            unzip -q "$ZIP" -d project
            SETTINGS=$(find project -name settings.gradle.kts -not -path "*/__MACOSX/*" | head -n1)
          else
            SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          fi
          if [ -z "$SETTINGS" ]; then
            echo "No project found. Files in repo:"
            ls -la
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Siraj-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
