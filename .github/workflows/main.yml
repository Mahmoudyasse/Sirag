name: Build APK

on:
  push:
    branches: [main, master, native-kotlin-transition]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 2 -type f -iname "*siraj*.zip" -not -path "./.git/*" | head -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Using project archive: $ZIP"
            mkdir -p project
            unzip -oq "$ZIP" -d project
            SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path "*/__MACOSX/*" | head -n1 || true)
          else
            SETTINGS=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path "./.git/*" | head -n1 || true)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "No Gradle settings file found."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building from: $PROJECT_DIR"

          SOURCE_INDEX=""
          if [ -f app/src/main/assets/index.html ]; then
            SOURCE_INDEX="app/src/main/assets/index.html"
          elif [ -f index.html ]; then
            SOURCE_INDEX="index.html"
          fi
          TARGET_INDEX=$(find "$PROJECT_DIR" -type f -path "*/src/main/assets/index.html" | head -n1 || true)
          if [ -n "$SOURCE_INDEX" ] && [ -n "$TARGET_INDEX" ]; then
            cp "$SOURCE_INDEX" "$TARGET_INDEX"
            echo "Updated web asset: $TARGET_INDEX"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n1 || true)
          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: Siraj-APK
          path: ${{ env.APK_PATH }}
