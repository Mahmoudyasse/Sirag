name: Build Siraj APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project archive
        run: |
          test -f siraj_android.zip || (echo "::error::siraj_android.zip not found" && exit 1)

      - name: Unpack and locate Android project
        run: |
          rm -rf proj
          mkdir -p proj
          unzip -q siraj_android.zip -d proj
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/proj" -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE/proj" -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found inside siraj_android.zip"
            find proj -maxdepth 4 -type f | head -80
            exit 1
          fi
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::The located project has no app/build.gradle or app/build.gradle.kts"
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siraj-debug-apk
          path: proj/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
